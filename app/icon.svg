<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#43e97b" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38f9d7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer hexagon with glow -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="url(#g2)" stroke="url(#g1)" stroke-width="2" filter="url(#glow)"/>

  <!-- Interior shapes remain the same -->
  <rect x="14" y="24" width="36" height="20" rx="10" fill="url(#g1)" opacity="0.15" stroke="url(#g1)" stroke-width="1.5"/>
  <rect x="18" y="31" width="4" height="4" rx="0.5" fill="url(#g1)"/>
  <rect x="16" y="33" width="4" height="4" rx="0.5" fill="url(#g1)"/>
  <rect x="20" y="33" width="4" height="4" rx="0.5" fill="url(#g1)"/>
  <rect x="18" y="35" width="4" height="4" rx="0.5" fill="url(#g1)"/>
  <rect x="19" y="32" width="6" height="6" rx="0.5" fill="url(#g1)"/>
  <circle cx="44" cy="30" r="2.5" fill="#38f9d7" opacity="0.9"/>
  <circle cx="50" cy="34" r="2.5" fill="#43e97b" opacity="0.9"/>
  <circle cx="44" cy="38" r="2.5" fill="#00c6ff" opacity="0.9"/>
  <circle cx="38" cy="34" r="2.5" fill="#7b61ff" opacity="0.9"/>
  <path d="M34 14 L46 14 L46 26 L34 26 Z" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
  <line x1="37" y1="18" x2="43" y2="18" stroke="url(#g1)" stroke-width="1" opacity="0.5"/>
  <line x1="37" y1="21" x2="43" y2="21" stroke="url(#g1)" stroke-width="1" opacity="0.5"/>
</svg>